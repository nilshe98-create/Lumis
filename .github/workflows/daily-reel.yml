name: LUMIS daily reel

on:
  schedule:
    # 08:30 Taiwan time (UTC+8) = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write        # needed to save used.txt back to the repo
  issues: write          # needed to raise token / bank reminders

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-liberation
            python -m pip install --upgrade pip
            python -m pip install pillow
            python --version
            ffmpeg -version | head -1
          } 2>&1 | tee -a run.log

      - name: Generate today's post
        shell: bash
        run: |
          set -o pipefail
          python make_post.py 2>&1 | tee -a run.log

      - name: Publish to Instagram as a Reel
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          python publish.py 2>&1 | tee -a run.log

      - name: Also post to Threads
        if: always()
        shell: bash
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          python publish_threads.py 2>&1 | tee -a run.log

      - name: Health check (token expiry + line bank)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python check_health.py 2>&1 | tee -a run.log

      - name: Remember which line was posted
        if: success()
        shell: bash
        run: |
          git config user.name  "LUMIS autopost"
          git config user.email "actions@github.com"
          git add used.txt
          git diff --staged --quiet || git commit -m "posted: $(tail -n1 used.txt)"
          git push

      # Always show the log on the run's Summary page, success or failure
      - name: Show log on summary page
        if: always()
        shell: bash
        run: |
          echo "## LUMIS run log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 run.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no log captured)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Keep a copy of what was posted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumis-post-${{ github.run_number }}
          path: |
            out/
            run.log
          if-no-files-found: ignore
