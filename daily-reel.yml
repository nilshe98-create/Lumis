name: LUMIS daily reel

on:
  schedule:
    # 08:30 Taiwan time (UTC+8) = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:        # lets you also run it manually to test

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-liberation
          pip install --quiet pillow

      - name: Generate today's post
        run: python3 make_post.py

      - name: Publish to Instagram as a Reel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 publish.py

      - name: Keep a copy of what was posted
        uses: actions/upload-artifact@v4
        with:
          name: lumis-post-${{ github.run_number }}
          path: out/
